name: probe

# Latency benchmark: which keyless text->image model is fastest?

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Benchmark
        run: |
          set +e
          P="cinematic+wide+shot+of+a+marble+chessboard+in+a+dark+hall+a+golden+beam+of+light+shallow+depth+of+field+no+text"
          bench() {
            printf '%-28s ' "$1"
            curl -sS -L -o /tmp/p.bin \
              -w 'http=%{http_code} bytes=%{size_download} t=%{time_total}s\n' \
              --max-time 90 "$1" 2>&1 | tail -1
            head -c 80 /tmp/p.bin | tr -d '\0' ; echo
          }
          for m in flux nanobanana-2-lite nanobanana-2 seedream5 qwen-image zimage kontext dreamshaper recraft-v4.1-flash gpt-image-2; do
            bench "https://image.pollinations.ai/prompt/$P?model=$m&width=1024&height=576&seed=9"
          done
          echo "--- gen.pollinations (needs key, expect 401) ---"
          bench "https://gen.pollinations.ai/image/$P?model=flux&width=1024&height=576"
